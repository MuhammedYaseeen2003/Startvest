<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StartVest | Startup Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .logo-icon {
            margin-right: 10px;
            font-size: 2.5rem;
        }

        .page-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #00b4db;
            outline: none;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
        }

        .funding-range {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .funding-input {
            flex: 1;
        }

        .unit-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .unit-arrow {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #666;
            padding: 0 5px;
        }

        .unit-display {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            min-width: 80px;
            text-align: center;
        }

        .profile-image {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00b4db;
            margin-bottom: 10px;
        }

        .upload-btn {
            display: inline-block;
            background: #00b4db;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .upload-btn:hover {
            background: #0083b0;
        }

        .file-input {
            display: none;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #00b4db;
            color: white;
        }

        .btn-primary:hover {
            background: #0083b0;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .link {
            color: #00b4db;
            text-decoration: none;
            font-weight: 500;
        }

        .link:hover {
            text-decoration: underline;
        }

        .page {
            display: none;
        }

        .active {
            display: block;
        }

        .message {
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #cce7ff;
            color: #004085;
            border: 1px solid #b3d7ff;
        }

        @media (max-width: 768px) {
            .funding-range {
                flex-direction: column;
                align-items: stretch;
            }

            .form-actions {
                flex-direction: column;
                gap: 10px;
            }

            .links {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="logo-icon">🚀</span>
                Startup Investor Matcher
            </div>
            <div class="page-title">Startup Portal</div>
        </div>


        <!-- Reset Code Page -->
        <div id="reset-code-page" class="page active">
            <div class="content">
                <h2 style="text-align: center; margin-bottom: 20px;">Reset Password</h2>
                <p style="text-align: center; margin-bottom: 20px;">Enter the code sent to your registered email</p>

                <form id="reset-code-form" method="post" action="/forgot_password_post">
                    <div class="form-group">
                        <label for="reset-code">Verification Code</label>
                        <input type="text" id="reset-code" name="reset-code" placeholder="Enter the 6-digit code" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Verify Code</button>

                    <div class="links">
                        <a href="/" class="link">Back to login</a>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        function unit_change() {
            var unt=document.getElementById("unit-display").innerHTML;
            alert(unt);
        }
        // Page navigation
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

    </script>
</body>
</html>
